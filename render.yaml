services:
  # Static Site: React + Vite SPA (tinnitus-matcher)
  - type: web
    name: tinnitus-matcher
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      # SPA fallback: все пути отдаём на index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Кэш для ассетов с хэшем в имени — навсегда
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # sw.js и index.html всегда свежие
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
